<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Observability and evaluation: agent spans flow to Application Insights and Microsoft Foundry, where evidence is inspected at four levels of zoom and quality is measured by a dataset run and a trace run.">
  <title>Figure 3 — Observability and evaluation</title>

  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="980" height="640" fill="#ffffff"/>

  <!-- ===== Left: the running system ===== -->
  <g>
    <rect x="24" y="24" width="238" height="188" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="40" y="46" font-size="11.5" font-weight="700" fill="#475569">THE RUNNING SYSTEM</text>

    <rect x="40" y="58" width="206" height="30" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="143" y="77" font-size="11" fill="#4c1d95" text-anchor="middle">quotedesk-intake-v1</text>

    <rect x="40" y="94" width="206" height="30" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="143" y="113" font-size="11" fill="#4c1d95" text-anchor="middle">quotedesk-resolve-v1</text>

    <rect x="40" y="130" width="206" height="30" rx="5" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="143" y="149" font-size="11" fill="#4c1d95" text-anchor="middle">quotedesk-narrate-v1</text>

    <text x="40" y="180" font-size="10" fill="#64748b">Stable ids, set explicitly. The framework's</text>
    <text x="40" y="193" font-size="10" fill="#64748b">default is a random id per instance — which</text>
    <text x="40" y="206" font-size="10" fill="#64748b">would silently group nothing.</text>
  </g>

  <!-- arrow to App Insights -->
  <line x1="266" y1="118" x2="316" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#a3)"/>
  <text x="291" y="108" font-size="9.5" fill="#64748b" text-anchor="middle">OpenTelemetry</text>

  <!-- ===== App Insights ===== -->
  <g>
    <rect x="320" y="24" width="200" height="188" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="336" y="46" font-size="11.5" font-weight="700" fill="#1e3a8a">APPLICATION INSIGHTS</text>
    <text x="336" y="70" font-size="10.5" fill="#1d4ed8">gen_ai.agent.id</text>
    <text x="336" y="87" font-size="10.5" fill="#1d4ed8">gen_ai.input.messages</text>
    <text x="336" y="104" font-size="10.5" fill="#1d4ed8">gen_ai.output.messages</text>
    <text x="336" y="121" font-size="10.5" fill="#1d4ed8">tool calls · latency · tokens</text>

    <rect x="336" y="136" width="168" height="60" rx="5" fill="#ffffff" stroke="#93c5fd"/>
    <text x="346" y="154" font-size="9.5" font-weight="600" fill="#1e3a8a">Deliberately excluded:</text>
    <text x="346" y="169" font-size="9.5" fill="#1e40af">a photographed enquiry's image.</text>
    <text x="346" y="183" font-size="9.5" fill="#1e40af">It tells a judge nothing and is the</text>
    <text x="346" y="194" font-size="9.5" fill="#1e40af">most sensitive thing in the pipeline.</text>
  </g>

  <line x1="524" y1="118" x2="574" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#a3)"/>

  <!-- ===== Foundry ===== -->
  <g>
    <rect x="578" y="24" width="378" height="188" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="596" y="46" font-size="11.5" font-weight="700" fill="#4c1d95">MICROSOFT FOUNDRY</text>
    <text x="596" y="68" font-size="11" fill="#5b21b6">Both agents registered as external agents, so real</text>
    <text x="596" y="85" font-size="11" fill="#5b21b6">production traces attribute to a named agent.</text>

    <text x="596" y="112" font-size="10.5" font-weight="600" fill="#4c1d95">Foundry is used four ways:</text>
    <text x="596" y="131" font-size="10.5" fill="#5b21b6">1 · model inference   2 · tracing</text>
    <text x="596" y="148" font-size="10.5" fill="#5b21b6">3 · agent registration   4 · evaluation</text>
    <text x="596" y="174" font-size="10" fill="#7c3aed">Orchestration is the one deliberate substitution —</text>
    <text x="596" y="188" font-size="10" fill="#7c3aed">see §3.6 for why, and what was traded for what.</text>
  </g>

  <!-- ===== Four tiers of evidence ===== -->
  <text x="24" y="250" font-size="13" font-weight="700" fill="#0f172a">Where the evidence lives — four levels of zoom</text>
  <text x="24" y="268" font-size="10.5" fill="#64748b">Monitoring answers "what happened?". Tracing answers "where did it happen, and why?". Together: "how is it resolved and prevented?"</text>

  <g>
    <rect x="24" y="282" width="222" height="92" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="40" y="303" font-size="11" font-weight="700" fill="#334155">1 · Foundry Traces</text>
    <text x="40" y="321" font-size="10" fill="#64748b">One execution</text>
    <text x="40" y="341" font-size="10" fill="#475569">Every model call and tool call,</text>
    <text x="40" y="355" font-size="10" fill="#475569">in order, with its arguments,</text>
    <text x="40" y="369" font-size="10" fill="#475569">result and duration.</text>
  </g>

  <g>
    <rect x="260" y="282" width="222" height="92" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="276" y="303" font-size="11" font-weight="700" fill="#334155">2 · Foundry Monitoring</text>
    <text x="276" y="321" font-size="10" fill="#64748b">One agent</text>
    <text x="276" y="341" font-size="10" fill="#475569">Cost, token usage, run counts,</text>
    <text x="276" y="355" font-size="10" fill="#475569">tool activity, latency and</text>
    <text x="276" y="369" font-size="10" fill="#475569">error rates over time.</text>
  </g>

  <g>
    <rect x="496" y="282" width="222" height="92" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="512" y="303" font-size="11" font-weight="700" fill="#334155">3 · App Insights</text>
    <text x="512" y="321" font-size="10" fill="#64748b">Aggregated, across agents</text>
    <text x="512" y="341" font-size="10" fill="#475569">Agents Preview — durations,</text>
    <text x="512" y="355" font-size="10" fill="#475569">trends and errors across every</text>
    <text x="512" y="369" font-size="10" fill="#475569">connected resource.</text>
  </g>

  <g>
    <rect x="732" y="282" width="224" height="92" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="748" y="303" font-size="11" font-weight="700" fill="#334155">4 · In-app trace panel</text>
    <text x="748" y="321" font-size="10" fill="#64748b">What the salesperson sees</text>
    <text x="748" y="341" font-size="10" fill="#475569">Plain-language steps, live, and</text>
    <text x="748" y="355" font-size="10" fill="#475569">replayable afterwards. Internal</text>
    <text x="748" y="369" font-size="10" fill="#475569">tool names never surface here.</text>
  </g>

  <!-- ===== Evaluation ===== -->
  <text x="24" y="412" font-size="13" font-weight="700" fill="#0f172a">Measured quality — two runs, because each answers something the other cannot</text>

  <g>
    <rect x="24" y="426" width="458" height="192" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="44" y="450" font-size="12" font-weight="700" fill="#14532d">RUN A — dataset evaluation</text>
    <text x="44" y="472" font-size="10.5" fill="#166534">10 cases, each with ground truth written <tspan font-weight="700">before</tspan> the case was run.</text>

    <rect x="44" y="484" width="132" height="26" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="110" y="501" font-size="10" fill="#14532d" text-anchor="middle">3 · resolvable</text>

    <rect x="186" y="484" width="132" height="26" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="252" y="501" font-size="10" fill="#14532d" text-anchor="middle">3 · needs a flag</text>

    <rect x="328" y="484" width="134" height="26" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="395" y="501" font-size="10" fill="#14532d" text-anchor="middle">4 · must refuse</text>

    <text x="44" y="534" font-size="10.5" fill="#166534">A suite of only resolvable cases scores beautifully and proves nothing.</text>
    <text x="44" y="551" font-size="10.5" fill="#166534">The refusal cases are where the architecture's claim actually lives.</text>
    <text x="44" y="575" font-size="10" fill="#15803d">Evaluators: coherence · fluency · relevance · groundedness ·</text>
    <text x="44" y="589" font-size="10" fill="#15803d">task_adherence · tool_call_accuracy · safety · response_completeness</text>
    <text x="44" y="606" font-size="10" fill="#15803d">Thresholds fixed before the baseline ran, never adjusted after seeing scores.</text>
  </g>

  <g>
    <rect x="496" y="426" width="460" height="192" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="516" y="450" font-size="12" font-weight="700" fill="#713f12">RUN B — trace evaluation</text>
    <text x="516" y="472" font-size="10.5" fill="#854d0e">Graded against real production traces from the registered agents.</text>
    <text x="516" y="489" font-size="10.5" fill="#854d0e">No dataset to build — this is what registration buys.</text>

    <text x="516" y="516" font-size="11" font-weight="700" fill="#713f12">What the scores do not prove</text>
    <text x="516" y="536" font-size="10.5" fill="#854d0e">• <tspan font-weight="600">Pricing is never judged by a model.</tspan> Every rupee is proven</text>
    <text x="528" y="551" font-size="10.5" fill="#854d0e">by unit tests over the domain, not by an evaluator.</text>
    <text x="516" y="571" font-size="10.5" fill="#854d0e">• Two perfect scores say nothing about metrics not run.</text>
    <text x="516" y="591" font-size="10.5" fill="#854d0e">• External agents are preview: no human evaluation, no</text>
    <text x="528" y="606" font-size="10.5" fill="#854d0e">trace-to-dataset conversion, no red teaming available.</text>
  </g>
</svg>
