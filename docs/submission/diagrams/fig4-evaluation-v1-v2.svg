<text x="24" y="442" font-size="11.5" fill="#334155">Safety: Violence 8/8 and IndirectAttack 8/8 in both runs.  TaskCompletion 2/8 → 2/8: every failure reads "stopped at the human approval gate" — the design, not a defect.</text>
<text x="24" y="462" font-size="11.5" fill="#334155">Fixed between runs: full purchase history, received date for "need by 5th", short-stock and late-delivery warnings, no freight on an empty quote, no invented customer name.</text>
<text x="24" y="482" font-size="11.5" fill="#334155">Honest regressions: Fluency 3.88 → 3.75; short-stock IntentResolution 4 → 3 (the judge read the new stock warning as an unresolved request).</text>
